<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block III Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: full-bleed 3D plan, a drafting-table side panel (bottom sheet on phones), floor rail on the map edge.
   Palette borrows from the building's own fire-escape boards: plan paper, drafting ink, exit-sign green, "you are here" amber. */
:root {
  --paper: #eef1f3;
  --panel: #fbfcfc;
  --ink: #17233a;
  --ink-2: #4b5870;
  --rule: #d5dbe2;
  --exit: #138a4a;
  --exit-soft: #dff2e7;
  --here: #d98a00;
  --field: #f2f5f7;
  --shadow: 0 1px 2px rgba(23, 35, 58, .08), 0 8px 24px rgba(23, 35, 58, .08);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1722; --panel: #151f2c; --ink: #e2e8ef; --ink-2: #9aa7b8; --rule: #263345;
    --exit: #35c97a; --exit-soft: #143326; --here: #f2b233; --field: #1b2737;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1722; --panel: #151f2c; --ink: #e2e8ef; --ink-2: #9aa7b8; --rule: #263345;
  --exit: #35c97a; --exit-soft: #143326; --here: #f2b233; --field: #1b2737;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--exit); outline-offset: 2px; }

.app { position: relative; height: 100%; display: grid; grid-template-columns: 380px 1fr; }
.panel {
  background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; z-index: 3;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.panel-head { padding-block: 18px 12px; display: grid; gap: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }

.route-form { display: grid; grid-template-columns: 22px 1fr 36px; gap: 8px 10px; align-items: center; padding-block: 8px 12px; border-bottom: 1px solid var(--rule); }
.dot { width: 12px; height: 12px; border-radius: 50%; justify-self: center; }
.dot.from { background: var(--here); box-shadow: 0 0 0 3px color-mix(in srgb, var(--here) 25%, transparent); }
.dot.to { background: var(--exit); border-radius: 2px; transform: rotate(45deg); }
.field { position: relative; min-width: 0; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--field); }
.field input::placeholder { color: var(--ink-2); }
.swap { grid-row: 1 / span 2; grid-column: 3; height: 36px; border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; font-size: 16px; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; z-index: 10; padding: 4px; }
.suggest button { display: grid; grid-template-columns: 34px 1fr; gap: 8px; width: 100%; text-align: left; padding: 7px 8px; background: none; border: 0; border-radius: 6px; align-items: baseline; }
.suggest button:hover, .suggest button[aria-selected="true"] { background: var(--field); }
.fl { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.opts { grid-column: 2 / span 2; display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--exit); }

.summary { display: flex; align-items: baseline; gap: 12px; padding-block: 14px 6px; flex-wrap: wrap; }
.summary .big { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.summary .meta { color: var(--ink-2); font-size: 13px; }
.steps-wrap { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; }
ol.steps li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 10px 6px; border-radius: 8px; cursor: pointer; }
ol.steps li + li { border-top: 1px dashed var(--rule); }
ol.steps li:hover { background: var(--field); }
ol.steps li.active { background: var(--exit-soft); }
.ico { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--field); color: var(--ink); }
.ico svg { width: 16px; height: 16px; }
li[data-icon="end"] .ico { background: var(--exit); color: #fff; }
li[data-icon="start"] .ico { background: var(--here); color: #fff; }
li[data-icon="lift"] .ico, li[data-icon="stairs"] .ico { background: var(--ink); color: var(--panel); }
.stxt { line-height: 1.45; padding-top: 4px; }
.sfl { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); padding-top: 6px; }
.empty { color: var(--ink-2); padding: 18px 4px; line-height: 1.5; }
.panel-foot { border-top: 1px solid var(--rule); padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-weight: 500; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.note { font-size: 12px; color: var(--ink-2); }

.map { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.map canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -50%); font-size: 11px; line-height: 1.2; text-align: center; color: var(--ink); background: color-mix(in srgb, var(--panel) 82%, transparent); padding: 2px 6px; border-radius: 4px; max-width: 118px; text-wrap: balance; }
.lbl.hit { background: var(--exit); color: #fff; font-weight: 600; }
.lbl.src { background: var(--here); color: #fff; font-weight: 600; }
.lbl small { display: block; font-family: var(--f-mono); font-size: 10px; opacity: .75; }

.rail { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.rail button { width: 40px; height: 34px; border: 0; background: none; border-radius: 7px; font-family: var(--f-mono); font-weight: 500; position: relative; }
.rail button.on { background: var(--ink); color: var(--panel); }
.rail button.onroute::after { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--exit); }
.rail .sep { height: 1px; background: var(--rule); margin: 2px 4px; }
.floorcap { position: absolute; left: 16px; top: 12px; font-family: var(--f-display); font-weight: 700; font-size: 15px; background: var(--panel); border: 1px solid var(--rule); padding: 6px 10px; border-radius: 8px; box-shadow: var(--shadow); }
.legend { position: absolute; left: 16px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 10px; border-radius: 8px; max-width: calc(100% - 32px); }
.maperr { position: absolute; left: 16px; right: 70px; bottom: 56px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-family: var(--f-mono); font-size: 11px; color: var(--ink); white-space: pre-wrap; word-break: break-word; max-height: 40%; overflow: auto; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); z-index: 20; display: grid; place-items: center; padding: 16px; }
.sheet-card { background: var(--panel); border-radius: 12px; width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.sheet-head h2 { font-family: var(--f-display); margin: 0; font-size: 18px; }
.sheet-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.sheet-tools input { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--field); min-width: 0; flex: 1 1 260px; }
.qr-grid { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.qr { border: 1px solid var(--rule); border-radius: 10px; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; background: #fff; color: #17233a; }
.qr .code img, .qr .code canvas { width: 120px; height: 120px; }
.qr b { font-size: 12px; }
.qr span { font-family: var(--f-mono); font-size: 10px; color: #4b5870; word-break: break-all; }

.walkbtn { margin-left: auto; }
.walk { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; margin-block: 12px 4px; display: grid; gap: 8px; background: var(--field); }
.walk.done { border-color: var(--exit); background: var(--exit-soft); }
.walk-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.walk-head { font-family: var(--f-display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.walk-text { margin: 0; font-size: 16px; line-height: 1.4; }
.walk-floor { width: 100%; padding: 12px; font-size: 15px; }
.walk-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.walk-hint { font-size: 12px; color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.panel.walking .route-form, .panel.walking .summary { display: none; }
@media (max-width: 760px) {
  .panel.walking .panel-head { display: none; }
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .map { grid-row: 1; }
  .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--rule); max-height: 52vh; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .panel-head { padding-block: 10px 6px; }
  h1 { font-size: 18px; }
  .legend { display: none; }
  .rail { top: 8px; padding: 3px; gap: 2px; }
  .rail button { width: 36px; height: 28px; font-size: 13px; }
  .floorcap { top: 8px; left: max(12px, env(safe-area-inset-left, 0px)); }
  .panel.collapsed .steps-wrap { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="panel" id="panel">
    <div class="panel-head">
      <span class="eyebrow">SJEC · Academic Block III</span>
      <h1>Block III Navigator</h1>
    </div>
    <div class="route-form">
      <span class="dot from" aria-hidden="true"></span>
      <div class="field">
        <input id="from" type="text" autocomplete="off" placeholder="Where are you? (room, lab, lift…)" aria-label="Starting point">
        <div class="suggest" id="from-s" hidden></div>
      </div>
      <button class="swap" id="swap" title="Swap start and destination" aria-label="Swap start and destination">⇅</button>
      <span class="dot to" aria-hidden="true"></span>
      <div class="field">
        <input id="to" type="text" autocomplete="off" placeholder="Where to?" aria-label="Destination">
        <div class="suggest" id="to-s" hidden></div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="noStairs"> Avoid stairs</label>
        <label><input type="checkbox" id="noLifts"> Avoid lifts</label>
      </div>
    </div>
    <div class="walk" id="walk" hidden aria-live="polite">
      <div class="walk-top">
        <span class="walk-head" id="wkHead">In 8 m</span>
        <button class="btn" id="wkStop">Stop</button>
      </div>
      <p class="walk-text" id="wkText"></p>
      <button class="btn primary walk-floor" id="wkFloor" hidden>I'm on floor 6</button>
      <div class="walk-meta">
        <span id="wkCount">0 steps</span>
        <button class="btn small" id="wkSim" hidden>+1 step</button>
      </div>
      <div class="walk-meta">
        <span>Step length</span>
        <button class="btn small" id="wkMinus" aria-label="Shorter steps">−</button>
        <span id="wkStride" class="mono">0.70 m</span>
        <button class="btn small" id="wkPlus" aria-label="Longer steps">+</button>
        <label for="wkSens" class="sr">Sensitivity</label>
        <select id="wkSens" class="btn small" aria-label="Step sensitivity">
          <option value="low">Firm steps</option>
          <option value="normal">Normal</option>
          <option value="high">Light steps</option>
        </select>
      </div>
      <div class="walk-hint"><span id="wkSensor">Waiting for motion sensor…</span> · Dot off? Tap the direction you're at.</div>
    </div>
    <div class="summary" id="summary" hidden>
      <span class="big" id="sumMetres"></span>
      <span class="meta" id="sumMeta"></span>
      <button class="btn primary walkbtn" id="walkBtn" hidden>Start walking</button>
    </div>
    <div class="steps-wrap">
      <ol class="steps" id="steps"></ol>
      <div class="empty" id="empty">Pick where you are and where you want to go. Scanning a room's QR code fills in the first box for you.</div>
    </div>
    <div class="panel-foot">
      <span class="note" id="dataNote"></span>
      <button class="btn" id="qrBtn">QR codes</button>
    </div>
  </aside>

  <main class="map" id="map">
    <div class="labels" id="labels"></div>
    <div class="floorcap" id="floorcap">Ground floor</div>
    <nav class="rail" id="rail" aria-label="Floors"></nav>
    <div class="legend" id="legend"></div>
    <div class="maperr" id="maperr" hidden></div>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Door QR codes</h2>
      <button class="btn" id="sheetClose">Close</button>
    </div>
    <div class="sheet-tools">
      <label class="note" for="qrBase">Site address</label>
      <input id="qrBase" type="url" spellcheck="false">
      <select id="qrFloor" class="btn" aria-label="Floor"></select>
    </div>
    <div class="qr-grid" id="qrGrid"></div>
  </div>
</div>

<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('maperr'); if (!box) return;
  box.hidden = false;
  box.textContent = 'Map error (please screenshot this):\n' + (e.message || e) + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : '');
});
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data/block3.js?v=5"></script>
<script src="js/graph.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/tracking.js?v=5"></script>
</body>
</html>
